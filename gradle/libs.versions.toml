[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
room = "2.6.1"
navigation = "2.8.4"
lifecycle = "2.8.7"
coroutines = "1.9.0"
datastore = "1.1.1"
core-ktx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
constraintlayout = "2.2.0"
fragment = "1.8.5"
splashscreen = "1.0.1"
desugar = "2.1.3"
ktlintGradle = "12.1.1"
ktlint = "1.3.1"
junit4 = "4.13.2"
mockk = "1.13.13"
