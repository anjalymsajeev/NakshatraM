espresso = "3.6.1"
# The Malayalam calendar SDK (separate project): https://github.com/anjalymsajeev/malayalam-calendar-kotlin
kollavarsham = "0.2.0-alpha01"

[libraries]
kollavarsham-panchangam = { module = "io.github.anjalymsajeev:kollavarsham-panchangam", version.ref = "kollavarsham" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
